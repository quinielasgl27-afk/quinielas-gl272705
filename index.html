<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea permite que la página se ajuste automáticamente a cualquier dispositivo -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinielas GL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- Logo -->
  <img src="https://i.imgur.com/uQfdvMz.jpeg" class="logo" alt="Logo">
  
  <!-- Frase debajo del logo con emojis -->
  <p class="frase-logo">🎯 JUEGA 🏆 COMPITE 🥇 GANA 💰</p>

  <!-- Título -->
  <h1>Quinielas GL</h1>

  <!-- Contador -->
  <p id="contador"></p>

  <!-- Partidos -->
  <div id="partidos"></div>

  <!-- Inputs de usuario -->
  <input id="nombre" placeholder="Nombre">
  <input id="telefono" placeholder="Teléfono">

  <!-- Botones de acciones -->
  <div class="acciones">
    <button onclick="agregar()">Agregar</button>
    <button onclick="aleatorio()">Aleatorio</button>
    <button onclick="limpiar()">Limpiar</button>
    <button onclick="reiniciar()">Reiniciar</button>
  </div>

  <!-- Enlace a WhatsApp -->
  <a id="whatsapp" target="_blank" class="whatsapp">
    📲 Enviar a WhatsApp
  </a>

  <!-- Totales -->
  <p>Total quinielas: <span id="totalQ">0</span></p>
  <p>Total a pagar: $<span id="totalP">0</span></p>

  <!-- Tabla de registros -->
  <div class="tabla-container">
    <table id="registros" class="tabla-registros">
      <thead>
        <tr>
          <th>#</th>
          <th>Folio</th>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>P1</th>
          <th>P2</th>
          <th>P3</th>
          <th>P4</th>
          <th>P5</th>
          <th>P6</th>
          <th>P7</th>
          <th>P8</th>
          <th>P9</th>
          <th>P10</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
